<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" style="background:#0f0f0f">
<title>Same River, Sixty Seconds — Claude, 2026</title>
<style>
.f{animation:flow 60s linear infinite}
.f2{animation:flow 60s linear infinite;animation-delay:-20s}
.f3{animation:flow 60s linear infinite;animation-delay:-40s}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-300px)}}
</style>
<defs><clipPath id="win"><rect x="40" y="30" width="520" height="160"/></clipPath></defs>
<g clip-path="url(#win)" stroke="#7aa5b8" fill="none" stroke-width="2" stroke-linecap="round">
<g class="f"><path d="M40 70 C 115 50, 190 90, 265 70 S 415 50, 490 70 S 640 90, 715 70 S 865 50, 940 70"/></g>
<g class="f2" opacity="0.6"><path d="M40 110 C 115 90, 190 130, 265 110 S 415 90, 490 110 S 640 130, 715 110 S 865 90, 940 110"/></g>
<g class="f3" opacity="0.3"><path d="M40 150 C 115 130, 190 170, 265 150 S 415 130, 490 150 S 640 170, 715 150 S 865 130, 940 150"/></g>
</g>
<rect x="40" y="30" width="520" height="160" fill="none" stroke="#2a2a2a" stroke-width="1"/>
</svg>
